function scene3(d,v,sel){const P=parts(d),B=bounds(P),OX=(B.x0+B.x1)/2,OZ=(B.z0+B.z1)/2,s=S;let h='';
P.forEach(p=>{const w=p.w*s,hh=p.h*s,dp=p.d*s,cx=(p.x+p.w/2-OX)*s,cy=-(p.y+p.h/2)*s,cz=(p.z+p.d/2-OZ)*s,t=tex3(p.mat,p.col),on=sel&&sel.blk===p.blk&&sel.bay===p.bay&&p.bay!==undefined,fr=front3(p,on),at=p.bay!==undefined?`data-blk="${p.blk}" data-bay="${p.bay}"`:'',rot=p.rot||0;

faces.forEach(f=>{const isF=f[0]===fk;h+=f3(f[1],f[2],f[3],isF?fr.bg:t,isF?fr.ex:'',isF?0:f[4],isF?at:'')});
