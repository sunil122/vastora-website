<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VASTORA | Interior Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d8ad61;--ink:#17130f;--panel:#191510eF;--line:#ffffff28}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17130f;color:#fff;font-family:Manrope,Arial,sans-serif}button{font:inherit;cursor:pointer}.stage{position:fixed;inset:0;background:#262019;overflow:hidden}.room-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transform-origin:center;transition:filter .35s,transform .25s;filter:saturate(.94) contrast(1.02)}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#100c08b8 0%,#100c0850 17%,transparent 34%,transparent 78%,#100c083d),linear-gradient(0deg,#0e0a0799,transparent 26%,transparent 82%,#0e0a0750)}.brand{position:fixed;z-index:4;left:28px;top:22px;letter-spacing:.23em;font-size:24px;font-weight:600}.brand:before{content:"";display:block;width:45px;height:20px;border-top:3px solid var(--gold);transform:skewY(-28deg);margin:0 0 5px 42px}.brand small{display:block;letter-spacing:.12em;font-size:9px;color:#e8d6b8;margin-top:4px}.slogan{position:fixed;z-index:4;right:25px;top:22px;padding:13px 19px;border:1px solid #ffffff30;border-radius:30px;background:#17130fc9;backdrop-filter:blur(14px);font-size:13px}.rail{position:fixed;z-index:5;left:16px;top:50%;transform:translateY(-50%);width:164px;padding:11px;background:#17130fd9;border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);display:grid;gap:9px}.room-choice{height:76px;border:1px solid #ffffff3a;border-radius:11px;overflow:hidden;position:relative;padding:0;background:#30271e;color:#fff;text-align:left}.room-choice img{width:100%;height:100%;object-fit:cover;filter:brightness(.65);transition:.2s}.room-choice span{position:absolute;left:10px;bottom:9px;font-size:12px;font-weight:600;text-shadow:0 1px 4px #000}.room-choice.active{outline:2px solid var(--gold);outline-offset:1px}.room-choice.active img{filter:brightness(.9)}.hotspot{position:absolute;z-index:3;width:39px;height:39px;border:2px solid #fff;border-radius:50%;background:#d5a343;color:#fff;font-size:25px;line-height:30px;box-shadow:0 0 0 7px #d5a3433b,0 4px 14px #0006;transition:transform .18s}.hotspot:hover{transform:scale(1.12)}.hotspot[data-item="sofa"]{left:33%;top:56%}.hotspot[data-item="table"]{left:55%;top:73%}.hotspot[data-item="lighting"]{left:49%;top:18%}.hotspot[data-item="media"]{left:77%;top:44%}.hotspot[data-item="shelving"]{left:91%;top:46%}.toolbar{position:fixed;z-index:5;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:5px;padding:8px;border:1px solid var(--line);border-radius:35px;background:#17130fe8;backdrop-filter:blur(16px)}.toolbar button{border:0;background:transparent;color:#f8f1e7;padding:10px 14px;border-radius:24px;font-size:12px}.toolbar button:hover{background:#ffffff1c}.toolbar button span{color:var(--gold);margin-right:6px}.side-panel{position:fixed;z-index:7;right:18px;top:50%;transform:translateY(-50%);width:min(330px,calc(100vw - 32px));max-height:80vh;overflow:auto;padding:20px;border:1px solid #d5aa5577;border-radius:18px;background:#17130ff0;backdrop-filter:blur(18px);display:none;box-shadow:0 15px 45px #0008}.side-panel.open{display:block}.panel-top{display:flex;justify-content:space-between;align-items:center}.panel-top button{border:0;background:#ffffff16;color:#fff;border-radius:50%;width:32px;height:32px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}.side-panel h2{font-size:21px;margin:7px 0}.side-panel p{color:#d1c6b8;font-size:13px;line-height:1.6}.option-list{display:grid;gap:8px;margin:14px 0}.option{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #ffffff25;border-radius:11px;background:#ffffff08;color:#fff;text-align:left}.option.selected{border-color:var(--gold);background:#d5aa5518}.option img{width:54px;height:48px;object-fit:cover;border-radius:7px}.option small{display:block;color:#c8bba8;font-size:10px;margin-top:3px}.swatches{display:flex;gap:10px;margin:12px 0 17px}.swatch{width:30px;height:30px;border-radius:50%;border:2px solid #ffffff70;box-shadow:0 0 0 2px #0005}.swatch.active{outline:2px solid var(--gold);outline-offset:3px}.apply{width:100%;border:0;border-radius:25px;background:var(--gold);color:#1b140c;padding:12px;font-weight:700}.status{position:fixed;z-index:4;left:50%;bottom:91px;transform:translateX(-50%);padding:7px 12px;border-radius:20px;background:#17130fc9;color:#f4dfb8;font-size:10px;white-space:nowrap}.top-actions{position:fixed;z-index:5;right:22px;bottom:22px;display:flex;gap:8px}.top-actions button{border:1px solid #ffffff35;border-radius:24px;background:#17130fe8;color:#fff;padding:12px 17px;font-size:12px}.top-actions .gold{background:var(--gold);color:#1c150c;border-color:var(--gold);font-weight:700}.zoom-indicator{font-size:10px;color:#e7d7bd;padding:8px 5px;min-width:42px;text-align:center}
@media(max-width:760px){.brand{left:13px;top:12px;font-size:17px}.brand:before{width:32px;height:13px;margin-left:28px}.brand small{font-size:7px}.slogan{top:12px;right:10px;font-size:10px;padding:9px 12px}.rail{left:8px;top:auto;bottom:80px;transform:none;width:96px;padding:6px;gap:6px}.room-choice{height:54px}.room-choice span{font-size:9px;left:6px;bottom:5px}.toolbar{bottom:10px;padding:4px;gap:0}.toolbar button{font-size:10px;padding:9px 10px}.toolbar button span{margin-right:3px}.top-actions{right:8px;bottom:70px;gap:5px}.top-actions button{font-size:10px;padding:9px 11px}.side-panel{right:8px;top:auto;bottom:120px;transform:none;max-height:55vh;padding:15px}.hotspot{width:31px;height:31px;font-size:20px;line-height:24px}.status{bottom:57px;font-size:9px}.hotspot[data-item="shelving"]{left:88%}}
</style>
</head>
<body>
<main class="stage" id="stage">
<img class="room-photo" id="roomPhoto" alt="Photorealistic luxury living room" src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=2400&q=90">
<div class="shade"></div>
<button class="hotspot" data-item="sofa" aria-label="Explore sofa">+</button><button class="hotspot" data-item="table" aria-label="Explore coffee table">+</button><button class="hotspot" data-item="lighting" aria-label="Explore lighting">+</button><button class="hotspot" data-item="media" aria-label="Explore media wall">+</button><button class="hotspot" data-item="shelving" aria-label="Explore shelving">+</button>
</main>
<div class="brand">VASTORA<small>INTERIOR EXPERIENCE</small></div><div class="slogan">Design Your Dream Space <span style="color:var(--gold)">✧</span></div>
<aside class="rail" id="roomRail">
<button class="room-choice active" data-room="living"><img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=400&q=75"><span>Living Room</span></button>
<button class="room-choice" data-room="bedroom"><img src="https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=400&q=75"><span>Bedroom</span></button>
<button class="room-choice" data-room="kitchen"><img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=400&q=75"><span>Kitchen</span></button>
<button class="room-choice" data-room="dining"><img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=400&q=75"><span>Dining Room</span></button>
<button class="room-choice" data-room="wardrobe"><img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=400&q=75"><span>Wardrobe</span></button>
</aside>
<section class="side-panel" id="panel"><div class="panel-top"><div class="eyebrow" id="panelType">Furniture selection</div><button id="closePanel" aria-label="Close">×</button></div><h2 id="panelTitle">Sofa collection</h2><p id="panelDescription">Choose a finish or an alternative piece. Your selection is reflected in this room preview.</p><div class="eyebrow">Available styles</div><div class="option-list" id="options"></div><div class="eyebrow">Material / colour</div><div class="swatches" id="swatches"></div><button class="apply" id="apply">Apply selection</button></section>
<div class="toolbar"><button id="reset"><span>⌂</span>Reset</button><button id="rotate"><span>⟳</span>Rotate</button><button id="minus"><span>−</span>Zoom</button><div class="zoom-indicator" id="zoomValue">100%</div><button id="plus"><span>＋</span>Zoom</button></div>
<div class="status" id="status">Select a gold + point to customise an item</div>
<div class="top-actions"><button id="fullscreen">⛶ Fullscreen</button><button class="gold" id="contact">Let's Talk ↗</button></div>
<script>
const rooms={
 living:{label:'Living Room',image:'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=2400&q=90',items:{sofa:'Sofa',table:'Coffee Table',lighting:'Chandelier & Lighting',media:'TV Feature Wall',shelving:'Display Shelves'}},
 bedroom:{label:'Bedroom',image:'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=2400&q=90',items:{sofa:'Bed & Headboard',table:'Bedside Table',lighting:'Bedroom Lighting',media:'Dresser',shelving:'Wardrobe Storage'}},
 kitchen:{label:'Kitchen',image:'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2400&q=90',items:{sofa:'Kitchen Cabinets',table:'Island Counter',lighting:'Pendant Lighting',media:'Appliances',shelving:'Open Shelves'}},
 dining:{label:'Dining Room',image:'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2400&q=90',items:{sofa:'Dining Chairs',table:'Dining Table',lighting:'Dining Chandelier',media:'Sideboard',shelving:'Display Cabinet'}},
 wardrobe:{label:'Wardrobe',image:'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=2400&q=90',items:{sofa:'Storage Modules',table:'Island / Drawer Unit',lighting:'Integrated Lighting',media:'Mirror & Dressing',shelving:'Shelving System'}}
};
const optionsByItem={
 sofa:[['Contemporary','Clean lines · premium fabric'],['Curved Luxury','Soft sculptural silhouette'],['Classic Modular','Flexible sectional layout']],
 table:[['Natural Stone','Veined stone surface'],['Warm Oak','Solid oak finish'],['Brushed Brass','Metal base detail']],
 lighting:[['Warm Gold','2700K warm ambience'],['Soft White','3000K balanced ambience'],['Statement Fixture','Sculptural focal lighting']],
 media:[['Calacatta Marble','Light veined stone'],['Dark Travertine','Rich natural texture'],['Walnut Panels','Warm timber finish']],
 shelving:[['Smoked Oak','Dark timber finish'],['Ivory Lacquer','Soft matte finish'],['Bronze Glass','Tinted glass & brass']]
};
const swatchColors=['#e7dfd2','#b69a79','#6c5542','#34312d','#c9a96e','#aeb4b2'];
let activeRoom='living',activeItem='sofa',zoom=1,rotation=0,selectedStyle=0,selectedColor=0;
const photo=document.getElementById('roomPhoto'),panel=document.getElementById('panel'),status=document.getElementById('status');
function setRoom(key){activeRoom=key;photo.src=rooms[key].image;photo.alt='Photorealistic '+rooms[key].label;document.querySelectorAll('.room-choice').forEach(b=>b.classList.toggle('active',b.dataset.room===key));document.querySelectorAll('.hotspot').forEach(b=>b.style.display='block');document.getElementById('panelTitle').textContent=rooms[key].label+' collection';panel.classList.remove('open');status.textContent=rooms[key].label+' · choose a gold hotspot to customise';zoom=1;rotation=0;renderTransform()}
function renderTransform(){photo.style.transform='scale('+zoom+') rotate('+rotation+'deg)';document.getElementById('zoomValue').textContent=Math.round(zoom*100)+'%'}
function openItem(key){activeItem=key;selectedStyle=0;selectedColor=0;const title=rooms[activeRoom].items[key];document.getElementById('panelType').textContent=rooms[activeRoom].label+' · customise';document.getElementById('panelTitle').textContent=title;document.getElementById('panelDescription').textContent='Explore available designs, materials and finishes for your '+title.toLowerCase()+'.';const list=document.getElementById('options');list.innerHTML='';(optionsByItem[key]||optionsByItem.sofa).forEach((o,i)=>{const b=document.createElement('button');b.className='option'+(i===0?' selected':'');b.innerHTML='<span style="font-size:21px;color:var(--gold)">◇</span><span><b>'+o[0]+'</b><small>'+o[1]+'</small></span>';b.onclick=()=>{selectedStyle=i;list.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};list.appendChild(b)});const sw=document.getElementById('swatches');sw.innerHTML='';swatchColors.forEach((c,i)=>{const b=document.createElement('button');b.className='swatch'+(i===0?' active':'');b.style.background=c;b.title='Finish '+(i+1);b.onclick=()=>{selectedColor=i;sw.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active')};sw.appendChild(b)});panel.classList.add('open')}
document.querySelectorAll('.room-choice').forEach(b=>b.addEventListener('click',()=>setRoom(b.dataset.room)));
document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>openItem(b.dataset.item)));
document.getElementById('closePanel').onclick=()=>panel.classList.remove('open');
document.getElementById('apply').onclick=()=>{status.textContent='Selected: '+(optionsByItem[activeItem]||optionsByItem.sofa)[selectedStyle][0]+' · finish '+(selectedColor+1)+' · '+rooms[activeRoom].items[activeItem];panel.classList.remove('open')};
document.getElementById('plus').onclick=()=>{zoom=Math.min(1.7,zoom+.1);renderTransform()};document.getElementById('minus').onclick=()=>{zoom=Math.max(1,zoom-.1);renderTransform()};
document.getElementById('reset').onclick=()=>{zoom=1;rotation=0;renderTransform();status.textContent='View reset'};
document.getElementById('rotate').onclick=()=>{rotation=(rotation+90)%360;renderTransform();status.textContent='Image view rotated · '+rotation+'°'};
document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.getElementById('contact').onclick=()=>location.href='index.html#contact';
document.getElementById('roomRail').addEventListener('dblclick',()=>{});
</script>
</body></html>
